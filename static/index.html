<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Video Detector</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0f;
      --surface: #16161a;
      --border: #2a2a30;
      --accent: #7c6af7;
      --accent-dim: #3d3578;
      --text: #e8e8f0;
      --muted: #6b6b80;
      --real: #34c77b;
      --ai-sora: #f76a6a;
      --ai-veo: #f7a46a;
      --radius: 12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px 36px;
      width: 100%;
      max-width: 560px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .method-tag {
      display: inline-block;
      font-size: 0.7rem;
      background: var(--accent-dim);
      color: var(--accent);
      border-radius: 4px;
      padding: 2px 8px;
      margin-bottom: 20px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    input[type="text"] {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]::placeholder { color: var(--muted); }
    input[type="text"]:focus { border-color: var(--accent); }

    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Status / progress */
    .status {
      font-size: 0.82rem;
      color: var(--muted);
      min-height: 20px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Result panel */
    .result {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      display: none;
    }

    .result.visible { display: block; }
    .result.real { border-color: var(--real); }
    .result.ai-sora { border-color: var(--ai-sora); }
    .result.ai-veo { border-color: var(--ai-veo); }

    .result-label {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .result.real .result-label { color: var(--real); }
    .result.ai-sora .result-label { color: var(--ai-sora); }
    .result.ai-veo .result-label { color: var(--ai-veo); }

    .confidence-bar-wrap {
      background: var(--border);
      border-radius: 4px;
      height: 6px;
      margin: 12px 0;
      overflow: hidden;
    }

    .confidence-bar {
      height: 100%;
      border-radius: 4px;
      transition: width 0.6s ease;
    }

    .result.real .confidence-bar { background: var(--real); }
    .result.ai-sora .confidence-bar { background: var(--ai-sora); }
    .result.ai-veo .confidence-bar { background: var(--ai-veo); }

    .confidence-text {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .result-detail {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 16px;
    }

    .stats {
      display: flex;
      gap: 16px;
    }

    .stat {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      flex: 1;
    }

    .stat-label {
      font-size: 0.68rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 1.05rem;
      font-weight: 600;
    }

    .error {
      background: #2a1010;
      border: 1px solid #5a1a1a;
      border-radius: 8px;
      padding: 14px 16px;
      font-size: 0.83rem;
      color: #f08080;
      display: none;
    }

    .error.visible { display: block; }

    /* Legend */
    .legend {
      margin-top: 28px;
      border-top: 1px solid var(--border);
      padding-top: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    .legend-item {
      font-size: 0.72rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .legend-title {
      font-size: 0.74rem;
      font-weight: 600;
      margin-bottom: 3px;
    }

    .legend-item.sora .legend-title { color: var(--ai-sora); }
    .legend-item.veo .legend-title { color: var(--ai-veo); }
    .legend-item.real .legend-title { color: var(--real); }
  </style>
</head>
<body>
  <div class="card">
    <span class="method-tag">Laplacian Noise Analysis</span>
    <h1>AI Video Detector</h1>
    <p class="subtitle">Paste a YouTube URL to analyse its noise signature and estimate whether the video was generated by an AI model.</p>

    <div class="input-row">
      <input type="text" id="urlInput" placeholder="https://www.youtube.com/watch?v=..." />
      <button id="analyzeBtn" onclick="analyze()">Analyze</button>
    </div>

    <div class="status" id="status"></div>
    <div class="error" id="error"></div>

    <div class="result" id="result">
      <div class="result-label" id="resultLabel"></div>
      <div class="confidence-bar-wrap">
        <div class="confidence-bar" id="confidenceBar" style="width:0%"></div>
      </div>
      <div class="confidence-text" id="confidenceText"></div>
      <div class="result-detail" id="resultDetail"></div>
      <div class="stats">
        <div class="stat">
          <div class="stat-label">Noise StdDev</div>
          <div class="stat-value" id="statStd">—</div>
        </div>
        <div class="stat">
          <div class="stat-label">Noise Mean</div>
          <div class="stat-value" id="statMean">—</div>
        </div>
      </div>
    </div>

    <div class="legend">
      <div class="legend-item sora">
        <div class="legend-title">Sora</div>
        std &lt; 4.5<br>mean &lt; 2.0
      </div>
      <div class="legend-item veo">
        <div class="legend-title">Veo</div>
        std &gt; 6.5<br>mean &gt; 3.0
      </div>
      <div class="legend-item real">
        <div class="legend-title">Real</div>
        std 4.5–6.5<br>mean 2.0–3.0
      </div>
    </div>
  </div>

  <script>
    const btn = document.getElementById('analyzeBtn');
    const statusEl = document.getElementById('status');
    const errorEl = document.getElementById('error');
    const resultEl = document.getElementById('result');

    function setStatus(msg) {
      statusEl.innerHTML = msg
        ? `<div class="spinner"></div><span>${msg}</span>`
        : '';
    }

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.classList.add('visible');
    }

    function clearUI() {
      errorEl.classList.remove('visible');
      resultEl.classList.remove('visible', 'real', 'ai-sora', 'ai-veo');
    }

    async function analyze() {
      const url = document.getElementById('urlInput').value.trim();
      if (!url) return;

      btn.disabled = true;
      clearUI();
      setStatus('Downloading video (this may take 30–60 seconds)…');

      try {
        const resp = await fetch('/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });

        const data = await resp.json();

        if (!resp.ok) {
          throw new Error(data.detail || 'Analysis failed');
        }

        setStatus('');
        renderResult(data);
      } catch (err) {
        setStatus('');
        showError(err.message || 'Something went wrong. Please try again.');
      } finally {
        btn.disabled = false;
      }
    }

    function renderResult(data) {
      const label = data.label;
      const cls = label.includes('Sora') ? 'ai-sora'
                : label.includes('Veo')  ? 'ai-veo'
                : 'real';

      resultEl.className = `result visible ${cls}`;
      document.getElementById('resultLabel').textContent = label;
      document.getElementById('confidenceText').textContent = `${data.confidence}% confidence`;
      document.getElementById('resultDetail').textContent = data.detail;
      document.getElementById('statStd').textContent = data.noise_std;
      document.getElementById('statMean').textContent = data.noise_mean;

      // Animate bar
      const bar = document.getElementById('confidenceBar');
      bar.style.width = '0%';
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          bar.style.width = data.confidence + '%';
        });
      });
    }

    document.getElementById('urlInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') analyze();
    });
  </script>
</body>
</html>
